include colors.conf

# ── Fonts ─────────────────────────────────────────────────────────────────────
font_family      SF Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# Keep Nerd Font glyphs (icons/powerline) for Private Use Area codepoints
symbol_map U+E000-U+F8FF,U+F0000-U+FFFFD,U+100000-U+10FFFD JetBrainsMono Nerd Font

# ── Padding & Spacing ─────────────────────────────────────────────────────────
window_padding_width 12 16

# ── Cursor ────────────────────────────────────────────────────────────────────
cursor_shape               beam
cursor_beam_thickness      1.8
cursor_blink_interval      0.5
cursor_stop_blinking_after 8.0

cursor_trail               3
cursor_trail_decay         0.1 0.4
cursor_trail_start_threshold 2

# ── Scrollback ────────────────────────────────────────────────────────────────
scrollback_lines 5000

# ── Window ────────────────────────────────────────────────────────────────────
background_opacity         0.92
background_blur            16
dynamic_background_opacity yes

window_border_width        0
draw_minimal_borders       yes
hide_window_decorations    yes

# ── Tabs ──────────────────────────────────────────────────────────────────────
tab_bar_edge              bottom
tab_bar_style             powerline
tab_powerline_style       slanted
tab_bar_min_tabs          2
tab_title_template        " {title} "
active_tab_font_style     bold

# ── Bell ──────────────────────────────────────────────────────────────────────
enable_audio_bell no
visual_bell_duration 0.0

# ── Misc ──────────────────────────────────────────────────────────────────────
confirm_os_window_close 0
shell_integration          enabled
